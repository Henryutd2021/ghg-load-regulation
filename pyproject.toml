[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghg-framework"
version = "1.0.0"
description = "Emission-intensity-informed demand-side load regulation for power-grid regions (framework of Li et al., Cell Reports Sustainability 2025)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Honglin Li"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.2", "xarray>=2024.6", "linopy>=0.4.4", "highspy>=1.7.2"]
keywords = ["demand response", "load shifting", "carbon intensity", "power systems", "mixed-integer programming"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
gurobi = ["gurobipy"]
test = ["pytest"]

[project.scripts]
ghg-framework = "ghg_framework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
